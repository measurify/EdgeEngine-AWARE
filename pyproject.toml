[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "edgeengine-aware"
version = "0.4.0"
description = "EdgeEngine AWARE: application- and energy-aware simulation environment for reinforcement learning in energy-harvesting Edge IoT systems."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Riccardo Berta", email = "riccardo.berta@unige.it" }]
keywords = [
  "reinforcement-learning", "gymnasium", "iot", "edge", "energy-harvesting", "tinyml",
  "smart-agriculture", "indoor-air-quality", "predictive-maintenance",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: System :: Hardware",
]
dependencies = ["numpy>=1.24", "gymnasium>=0.29", "matplotlib>=3.7"]

[project.urls]
Homepage = "https://github.com/measurify/EdgeEngine-AWARE"
Repository = "https://github.com/measurify/EdgeEngine-AWARE"
Documentation = "https://github.com/measurify/EdgeEngine-AWARE#readme"
Issues = "https://github.com/measurify/EdgeEngine-AWARE/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0", "jupyter", "nbformat", "nbconvert"]
rl = ["stable-baselines3>=2.0", "sb3-contrib>=2.0", "torch"]

# The wheel contains the environment only (the `edgeengine_aware` package).
# Weather traces, trained policy bundles, notebooks and the C runtime are in the
# repository, not in the pip package.
[tool.setuptools.packages.find]
include = ["edgeengine_aware*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
