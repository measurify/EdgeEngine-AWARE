# Builds the package and publishes it to PyPI when a version tag (v0.4.0, v1.2.3, ...) is pushed.
#
# Authentication uses PyPI "trusted publishing" (OpenID Connect): no API token is stored
# anywhere. One-time setup on https://pypi.org/manage/account/publishing/ :
#   PyPI project name : edgeengine-aware
#   Owner             : measurify
#   Repository name   : EdgeEngine-AWARE
#   Workflow name     : publish.yml
#   Environment name  : pypi
# and, on GitHub, Settings -> Environments -> create an environment called "pypi"
# (optionally with required reviewers, so that a publish waits for a manual approval).
#
# The tag must match the version in pyproject.toml; the first job checks it.
name: publish

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check that the tag matches pyproject.toml
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "$TAG" = "$VERSION" || { echo "tag v$TAG != version $VERSION"; exit 1; }
      - name: Run the tests once more
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest -q
      - name: Build sdist and wheel
        run: |
          pip install build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/edgeengine-aware/
    permissions:
      id-token: write   # required for trusted publishing
      contents: write   # to create the GitHub release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Create the GitHub release with the distributions attached
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
